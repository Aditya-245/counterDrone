[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skygym"
version = "0.1.0"
description = "SKYGYM - AI-enabled drone & counter-drone threat simulation trainer (SIH 2026, PS 26247)"
requires-python = ">=3.11,<3.12"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH"]
ignore = [
    "E501",
    "B008",
    "SIM108",
    "ARG001",
    "ARG002",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "SIM117"]
"app/db/*" = ["ARG002"]
"training/*" = ["ARG001"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
mypy_path = "backend"
files = ["backend/app/core"]

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["backend/tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: long-running integration sweeps (deselected by default in `make test`)",
    "perf: performance measurement tests",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["backend/app"]
branch = true