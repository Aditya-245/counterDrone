[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skygym"
version = "0.1.0"
description = "SKYGYM - AI-enabled drone & counter-drone threat simulation trainer (SIH 2026, PS 26247)"
# Vercel serves Python 3.12/3.13/3.14; the deployment targets 3.12. The
# local development environment still runs 3.11 and does not install this
# project (it installs backend/requirements.txt instead).
requires-python = ">=3.12,<3.14"
# The runtime pins, mirrored from backend/requirements-runtime.txt. Vercel
# installs the project from this table; `backend/scripts/check_pins.py` fails
# the build when the two files disagree.
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "websockets==14.1",
    "python-multipart==0.0.20",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "SQLAlchemy==2.0.36",
    "alembic==1.14.0",
    "numpy==2.2.1",
    "scipy==1.15.0",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend"]
# Alembic's `env.py` and its generated revisions are template output: they carry
# single quotes and trailing whitespace that the project style would rewrite on
# every autogenerate. The migration contents are tested, not linted.
exclude = ["backend/app/db/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH"]
ignore = [
    "E501",
    "B008",
    "SIM108",
    "ARG001",
    "ARG002",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "SIM117"]
"app/db/*" = ["ARG002"]
"training/*" = ["ARG001"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
mypy_path = "backend"
files = ["backend/app/core"]

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["backend/tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: long-running integration sweeps (deselected by default in `make test`)",
    "perf: performance measurement tests",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["backend/app"]
branch = true