# Alembic configuration for SKYGYM.
#
#   make migrate                 apply every migration to head
#   make migration M="..."       autogenerate a new revision
#   make downgrade               roll back one revision
#
# The database URL is NOT stored here: `env.py` reads it from
# `app.config.get_settings()` so there is exactly one source of truth and no
# credentials in version control.

[alembic]
script_location = backend/app/db/migrations
prepend_sys_path = backend
path_separator = os
version_path_separator = os

# The migration filenames are short and ordered by revision id.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S